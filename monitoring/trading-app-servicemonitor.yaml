apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
    name: trading-app-monitor
    namespace: monitoring
    labels:
      release: monitoring
spec:
  namespaceSelector:
    matchNames:
        - trading-app
  selector:
    matchLabels:
        app: trading-app

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
  