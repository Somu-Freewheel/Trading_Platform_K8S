apiVersion: apps/v1
kind: Deployment

metadata:
  name: trading-app
  namespace: trading-app

spec:
    replicas: 2

    selector:
        matchLabels:
            app: trading-app

    template:
      metadata:
        labels:
          app: trading-app

        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/path: "/actuator/prometheus"
          prometheus.io/port: "8080"

      spec:
        imagePullSecrets:
          - name : ghcr-secret
        containers:
            - name: trading-app
              image: ghcr.io/somu-freewheel/trading-app:8feae5b1edf13a12062d6b6c60d241be168c8938
              imagePullPolicy: IfNotPresent
              ports:
                - containerPort: 8080

              env:
                - name: SPRING_DATASOURCE_URL
                  value: jdbc:postgresql://postgres-service:5432/trading_db
                - name: SPRING_DATASOURCE_USERNAME
                  value: postgres
                - name: SPRING_DATASOURCE_PASSWORD
                  value: user123
                - name: SPRING_REDIS_HOST
                  value: redis-service
                - name: SPRING_REDIS_PORT
                  value: "6379"



